{% extends "admin/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<h1>Change password</h1>
<form method="post" class="panel" style="max-width:460px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Current password<input type="password" name="current" autocomplete="current-password" required></label>
  <label>New password <span class="help">(at least 8 characters)</span><input type="password" name="new" autocomplete="new-password" required minlength="8"></label>
  <label>New password again<input type="password" name="again" autocomplete="new-password" required></label>
  <button class="btn btn-gold">Change password</button>
</form>
{% endblock %}
