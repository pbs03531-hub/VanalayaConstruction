{% extends "admin/base.html" %}
{% block title %}Services{% endblock %}
{% block content %}
<h1>Services</h1>
{% for s in services %}
<form method="post" class="item">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="id" value="{{ s.id }}">
  <label>Service name<input type="text" name="title" value="{{ s.title }}" required></label>
  <label>Description<textarea name="description" rows="3">{{ s.description }}</textarea></label>
  <div class="row">
    <button class="btn btn-sm" name="action" value="save">Save</button>
    <button class="btn btn-sm btn-red" name="action" value="delete" formnovalidate onclick="return confirm('Delete this service?')">Delete</button>
  </div>
</form>
{% endfor %}
<form method="post" class="panel">
  <h2>Add a service</h2>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="action" value="add">
  <label>Service name<input type="text" name="title" required></label>
  <label>Description<textarea name="description" rows="3"></textarea></label>
  <button class="btn btn-gold">Add service</button>
</form>
{% endblock %}
